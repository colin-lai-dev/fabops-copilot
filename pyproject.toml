[project]
name = "fabops"
version = "0.1.0"
description = "Permission-aware RAG and anomaly triage agent for a fictional fab (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "flagembedding>=1.4.2",
    "jieba>=0.42.1",
    "fastmcp>=4.1.8",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pyjwt>=2.15.1",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/fabops/agent/prompts.py" = ["E501"]  # prompt text: one rule per line
"scripts/record_replay.py" = ["E501"]  # demo questions and captions kept on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the evals/ package
markers = ["db: requires a running Postgres (DATABASE_URL)"]
addopts = "-m 'not db'"
