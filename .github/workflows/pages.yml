# Static replay demo: build web/ in replay mode and deploy it to GitHub Pages.
# The site calls no backend; it shows answers recorded from the real system on synthetic data.
#
# Three things are deployed together:
#   /        the current site, built from main
#   /v8/     the previous version, built unchanged from the tag site-v8-final (noindex, with one
#            line at the top linking to the current site), kept so both designs can be compared
#   /lab/    a redirect to / (the design lab was adopted as site-v9)
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the site version shown in the footer
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:replay

      # --- the previous version (v8), from its tag; its source is not modified
      - uses: actions/checkout@v7
        with:
          ref: site-v8-final
          path: v8-src
      - working-directory: v8-src/web
        run: |
          npm ci
          VITE_SITE_VERSION=site-v8 npx vite build --mode replay --base /fabops-copilot/v8/
          node "$GITHUB_WORKSPACE/web/scripts/mark-old-version.mjs" dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/web/dist/v8"
          cp -r dist/. "$GITHUB_WORKSPACE/web/dist/v8/"

      # --- old /lab/ links land on the current site
      - run: |
          mkdir -p dist/lab
          cat > dist/lab/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta name="robots" content="noindex" />
          <meta http-equiv="refresh" content="0; url=../" />
          <title>FabOps Copilot</title>
          <a href="../">FabOps Copilot</a>
          HTML

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
