# Static replay demo (handoff 011 C): build web/ in replay mode and deploy it to GitHub Pages.
# The site calls no backend; it shows answers recorded from the real system on synthetic data.
#
# Design lab (handoff 022): the released site is always built from main. If a `design-lab`
# branch exists, it is built as well, under /fabops-copilot/lab/, and deployed alongside.
# The github-pages environment only lets main deploy, so a push to design-lab does not deploy
# by itself: it re-runs this workflow on main (`relay`), which then builds main + design-lab.
name: pages

on:
  push:
    branches: [main, design-lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    if: github.ref == 'refs/heads/design-lab'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the site version shown in the footer
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the released site's version is its site-vN tag (not the site-v8-final anchor)
      - run: VITE_SITE_VERSION="$(git describe --tags --match 'site-v*' --exclude '*-final' --abbrev=0)" npm run build:replay

      # --- design lab: built from the design-lab branch into dist/lab/, if the branch exists
      - id: lab
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin design-lab > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.lab.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: design-lab
          path: lab-src
          fetch-depth: 0
      - if: steps.lab.outputs.exists == 'true'
        working-directory: lab-src/web
        run: |
          npm ci
          VITE_LAB=1 VITE_BASE=/fabops-copilot/lab/ VITE_SITE_VERSION="lab-$(git rev-parse --short HEAD)" npm run build:replay
          mkdir -p "$GITHUB_WORKSPACE/web/dist/lab"
          cp -r dist/. "$GITHUB_WORKSPACE/web/dist/lab/"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
