services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fabops
      POSTGRES_PASSWORD: fabops
      POSTGRES_DB: fabops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabops -d fabops"]
      interval: 5s
      timeout: 3s
      retries: 20

# Ollama runs on the host (not in Compose) so it can use the host GPU directly.
# The app reaches it at LLM_BASE_URL (default http://localhost:11434/v1).

volumes:
  pgdata:
